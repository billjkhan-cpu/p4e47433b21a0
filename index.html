<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Agent FFF · Entraînement</title><style>:root{color-scheme:light dark;--bg:#f4f3ef;--card:#fffefa;--ink:#243530;--muted:#5f6f67;--line:#d8dfd6;--accent:#245d48;--accent-text:#fff;--wash:#e9efe7;--error:#9f3328;--success:#245d48;--shadow:0 2px 6px #1c362b08;font:400 16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}body:before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0);background:var(--bg);z-index:10}button,input,select,textarea{font:inherit}button,select,textarea,a{touch-action:manipulation}button{min-height:46px;min-width:44px;padding:11px 16px;border:1px solid transparent;border-radius:11px;font-weight:600;line-height:1.35;cursor:pointer;color:var(--ink);background:var(--wash);overflow-wrap:anywhere}button:disabled{opacity:.48;cursor:default}button:hover:not(:disabled){filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c09546;outline-offset:3px}.primary{background:var(--accent);color:var(--accent-text)}.secondary{background:var(--card);border-color:var(--line)}.quiet{background:none;padding-left:0;color:var(--muted)}.full{width:100%}.topbar{max-width:800px;margin:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:14px}.topbar>div{display:flex;align-items:center;gap:10px}.monogram{font-size:13px;letter-spacing:1px;font-weight:650;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card);white-space:nowrap}.brand{font-weight:650;font-size:17px;white-space:nowrap}.eyebrow{font-size:11px;font-weight:650;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin:12px 0 10px}.topbar>.eyebrow{max-width:112px;text-align:right;font-size:11px;letter-spacing:.65px}.storage{max-width:800px;margin:0 auto;padding:0 20px 10px;font-size:12px;color:var(--muted)}.warning{color:var(--error)}.alert:empty{display:none}.alert,#fatal{margin:10px auto;padding:14px 18px;border:1px solid var(--error);color:var(--error);max-width:760px;background:var(--card);border-radius:10px;overflow-wrap:anywhere}main{max-width:800px;margin:auto;padding:12px 20px calc(115px + env(safe-area-inset-bottom,0px));min-height:75vh}h1{font-size:28px;line-height:1.2;font-weight:630;letter-spacing:-.7px;margin:0 0 14px}h2{font-size:19px;line-height:1.35;font-weight:620;margin:0 0 9px}h3{font-size:16px;font-weight:650;margin:18px 0 6px}p{margin:0 0 14px;overflow-wrap:anywhere}.lead{color:var(--muted);margin-bottom:24px}.card{border:1px solid var(--line);border-radius:17px;background:var(--card);padding:21px;margin:0 0 16px;box-shadow:var(--shadow);overflow-wrap:anywhere;min-width:0}.card>:last-child{margin-bottom:0}.hero{border-top:3px solid var(--accent);padding-top:24px}.muted,.meta,.origin{color:var(--muted)}.meta,.origin{font-size:13px}.origin{margin:0 0 22px}.prompt{font-size:22px;line-height:1.4;letter-spacing:-.3px;margin:12px 0}.case-prompt{font-size:17px;font-weight:400;line-height:1.65;letter-spacing:0}.case-heading{font-size:22px;line-height:1.35}.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));gap:3px}.bottom-nav button{background:none;border-radius:10px;min-height:56px;padding:5px 1px;display:flex;flex-direction:column;gap:1px;align-items:center;color:var(--ink);font-size:12px;font-weight:550}.bottom-nav button[aria-current]{background:var(--wash);color:var(--accent)}.nav-icon{font-size:20px;line-height:23px}fieldset{border:0;padding:0;margin:0 0 22px;min-width:0}legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:10px}.option{display:flex;align-items:center;gap:12px;min-height:52px;min-width:44px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}.option:has(input:checked){background:var(--wash);border-color:var(--accent)}input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;accent-color:var(--accent);margin:0}.field-label{display:block;margin-bottom:20px;font-size:14px;color:var(--muted)}select,textarea{display:block;width:100%;min-height:46px;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}textarea{resize:vertical;min-height:120px}.feedback{padding:17px;margin:22px 0 15px;background:var(--wash);border-left:3px solid var(--success);border-radius:0 10px 10px 0}.feedback.incorrect{border-left-color:var(--error)}.feedback h2{font-size:18px}.references{margin-top:16px}.source{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.source a{display:block;min-height:44px;min-width:44px;color:var(--accent);overflow-wrap:anywhere}.session-line{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0}.timer{font-variant-numeric:tabular-nums;font-size:16px;background:var(--wash);padding:5px 10px;border-radius:7px;white-space:nowrap}progress{display:block;width:100%;height:5px;border:0;border-radius:9px;margin:14px 0 24px;accent-color:var(--accent)}.actions{display:flex;gap:10px;margin:12px 0 20px}.actions>*{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{font-size:27px;font-weight:620;line-height:1.2}.chart{width:100%;height:9px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.chart>span{display:block;height:100%;background:var(--accent)}summary{cursor:pointer;min-height:44px;min-width:44px;padding:10px 0}details{margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}input[type=file]{display:block;width:100%;min-height:44px;font-size:14px}.file-label{display:block;margin:18px 0}#fatal{font-weight:600}@media(min-width:700px){.bottom-nav{left:50%;transform:translateX(-50%);max-width:780px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}.topbar{padding-top:30px}main{padding-top:22px}.card{padding:26px}}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14221f;--card:#1c2c27;--ink:#e9eee7;--muted:#acbdb1;--line:#364d42;--accent:#b4d7b9;--accent-text:#193027;--wash:#293f33;--error:#f2afa1;--success:#b4d7b9;--shadow:none}}:root[data-theme=dark]{--bg:#14221f;--card:#1c2c27;--ink:#e9eee7;--muted:#acbdb1;--line:#364d42;--accent:#b4d7b9;--accent-text:#193027;--wash:#293f33;--error:#f2afa1;--success:#b4d7b9;--shadow:none}
</style></head><body><div id="app"></div><noscript>Activez JavaScript pour utiliser les exercices. Aucun envoi réseau n’est effectué.</noscript><script id="bank" type="application/json">{"schema_version":1,"title":"Agent FFF","updated_on":"2026-11-16","exam_date":"2026-11-23","notice":"Première banque pédagogique inspirée de la forme des extraits CNOSF : ni sujet officiel, ni examen blanc complet, ni prédiction. QCM : 1 point par réponse exacte, sans point négatif ; cas pratiques : autoévaluation séparée. Droit daté dans chaque source ; la date de référence du jury 2026 reste à confirmer. Sauvegarde sur cet appareil seulement, sans synchronisation automatique. Exportez le bilan pour le transmettre à Hermes.","priorities":[{"title":"Priorité : droit du sport, pas seulement droit des affaires","body":"Choix pédagogique : agents, incompatibilités, dopage, fédérations et CCNS. Les extraits CNOSF 2023, 2024 et 2025 contiennent respectivement un cas de ligue professionnelle, d'agent et de dopage. Ce petit corpus ne permet aucune probabilité de sujet.","level":"priorite"},{"title":"Aucune matière sacrifiée","body":"Les huit rubriques officielles restent à couvrir, notamment fiscalité, sociétés, sécurité sociale et droits de la personnalité. Cette première banque ne couvre pas encore chaque sous-thème du programme : une matière moins représentée ici ne devient pas une impasse.","level":"vigilance"},{"title":"Versions : une annale peut avoir changé de réponse","body":"Les questions agents de cette série annoncent expressément la version du Code du sport au 20 octobre 2026. Ne pas confondre ces règles avec celles des annales 2023–2025, ni avec une date de référence du jury qui n'est pas établie.","level":"vigilance"},{"title":"Méthode de cas pratique","body":"Faits utiles → question juridique → règle précise → application → conclusion. Respecter le nombre demandé : si deux motifs sont attendus, sélectionner deux motifs justes plutôt qu'une liste hasardeuse. Alterner entraînements sur écran et rappel actif sans ressources.","level":"methode"},{"title":"Forums : des indices, pas des impasses sûres","body":"Les retours publics ont été examinés : forums anciens ou indirects, témoignages promotionnels et peu de comptes rendus récents exploitables sur la générale CNOSF. Ils ne justifient aucune impasse ni probabilité de sujet. Les priorités reposent donc surtout sur le programme officiel et les extraits 2023–2025 ; les corrections de cette banque utilisent des sources institutionnelles.","level":"vigilance"}],"sources":[{"id":"agents","label":"Légifrance — Sport professionnel","url":"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071318/LEGISCTA000006151566/2026-10-20","article":"Code du sport, L.222-5, L.222-7, L.222-9, L.222-12-1, L.222-17 et L.222-20","version":"Consolidation au 20/10/2026 ; règles agents issues de la loi du 03/08/2026. Date de référence du jury non établie.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"validite","label":"Légifrance — Validité du contrat","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032040911","article":"Code civil, article 1128","version":"En vigueur depuis le 01/10/2016 ; article lu intégralement.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"inexecution","label":"Légifrance — Inexécution","url":"https://legifrance.gouv.fr/codes/article_lc/LEGIARTI000036829854","article":"Code civil, article 1217","version":"En vigueur depuis le 01/10/2018 ; liste des sanctions et règle de cumul lues.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"mandat","label":"Légifrance — Mandat","url":"https://legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070721/LEGISCTA000006118139","article":"Code civil, articles 1984 et 1998","version":"Dispositions consultées le 16/11/2026 ; articles cités en vigueur depuis le 21/03/1804.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"assoc","label":"Service Public — Administration d'une association","url":"https://www.service-public.gouv.fr/particuliers/vosdroits/F34797","article":"Loi du 01/07/1901, article 5 ; régime général hors Alsace-Moselle","version":"Fiche institutionnelle consultée le 16/11/2026 : déclaration sous trois mois et opposabilité à compter de la déclaration.","checked_on":"2026-11-16","kind":"Explication institutionnelle"},{"id":"assurance","label":"Légifrance — Assurance sportive","url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006151574","article":"Code du sport, articles L.321-1 et L.321-4","version":"Chapitre consulté le 16/11/2026 ; L.321-1 en vigueur depuis le 25/05/2006. Distinction RC / assurance de personnes.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"exclusion","label":"Légifrance — Exclusions d'assurance","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006791984","article":"Code des assurances, article L.113-1","version":"Rédaction issue de la loi du 07/01/1981 ; article lu intégralement.","checked_on":"2026-11-16","kind":"Texte légal officiel"},{"id":"afld-responsabilite","label":"AFLD — Responsabilité objective","url":"https://www.afld.fr/la-lutte-antidopage/les-regles-antidopage/la-responsabilite-objective/","article":"Principe de responsabilité objective ; Code du sport, L.232-9 pour le cadre légal","version":"Explication officielle consultée le 16/11/2026 ; ne pas confondre constat d'une violation et niveau de sanction.","checked_on":"2026-11-16","kind":"Explication de l'autorité antidopage"},{"id":"afld-glossaire","label":"AFLD — Glossaire juridique","url":"https://www.afld.fr/la-lutte-antidopage/les-regles-antidopage/glossaire-juridique/","article":"Entrées AUT, résultat d'analyse anormal, collège, commission des sanctions","version":"Glossaire pédagogique officiel consulté le 16/11/2026 ; formulations explicatives distinctes du texte légal.","checked_on":"2026-11-16","kind":"Explication de l'autorité antidopage"},{"id":"social","label":"Urssaf — Éléments soumis à cotisations","url":"https://www.urssaf.fr/accueil/salarie/cotisations-urssaf-bulletin-paie.html","article":"Assiette des cotisations : salaires, primes, avantages en nature ; frais professionnels sous conditions","version":"Page publiée le 03/06/2025, consultée le 16/11/2026 ; aucun barème chiffré utilisé.","checked_on":"2026-11-16","kind":"Explication de l'organisme de recouvrement"},{"id":"tva","label":"DGFiP — Déduire la TVA sur les achats","url":"https://www.impots.gouv.fr/professionnel/questions/comment-deduire-la-tva-sur-mes-achats","article":"CGI, article 271 et annexe II, article 206 ; conditions générales du droit à déduction","version":"Page modifiée le 14/10/2026 ; aucune règle annoncée pour 2027 n'est anticipée.","checked_on":"2026-11-16","kind":"Explication de l'administration fiscale"},{"id":"image","label":"Économie — Droit à l'image","url":"https://www.economie.gouv.fr/apie/droit-limage-des-personnes-et-des-biens","article":"Droit à l'image, au nom et à la voix : autorisation d'exploitation d'une personne identifiable","version":"Page institutionnelle consultée le 16/11/2026 ; cas publicitaire, hors exception d'information.","checked_on":"2026-11-16","kind":"Explication institutionnelle"},{"id":"entreprises","label":"Service Public Entreprendre — Redressement","url":"https://entreprendre.service-public.gouv.fr/vosdroits/F37434","article":"Code de commerce, L.631-1 et L.640-1 : redressement / liquidation","version":"Fiche vérifiée le 01/01/2025, consultée le 16/11/2026 ; distinction de principe, sans délai ni seuil chiffré enseigné.","checked_on":"2026-11-16","kind":"Explication institutionnelle"},{"id":"sanction-travail","label":"Légifrance — Sanctions pécuniaires","url":"https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006901446","article":"Code du travail, article L.1331-2","version":"Texte de l'article consulté intégralement le 16/11/2026.","checked_on":"2026-11-16","kind":"Texte légal officiel"}],"sets":[{"id":"agents-2026","title":"01 · Agents : règles et pièges de version","subtitle":"8 QCM + 1 cas pratique · droit expressément arrêté au 20 octobre 2026","minutes":35,"items":[{"id":"AG01","type":"mcq","topic":"Droit du sport","prompt":"Selon L.222-7 dans sa version au 20 octobre 2026, quel titre est visé par la partie législative pour exercer l'activité d'agent sportif ? Une seule réponse.","options":["Une simple immatriculation commerciale","Une carte professionnelle d'agent sportif délivrée par la fédération délégataire compétente","Un diplôme comptable ou juridique, à lui seul","Une licence FIFA suffisante à elle seule pour le régime national français"],"correct":[1],"explanation":"L.222-7 emploie désormais la carte professionnelle délivrée, suspendue ou retirée par la fédération délégataire. Les anciennes annales peuvent employer « licence » : ne pas en déduire la réponse applicable à une autre version du droit. Cette question porte uniquement sur la version législative indiquée.","trap":"Ne pas répondre à une question datée de 2026 avec une fiche ancienne utilisant seulement « licence ».","source_ids":["agents"],"origin":"Création pédagogique — L.222-7, version au 20/10/2026"},{"id":"AG02","type":"mcq","topic":"Droit du sport","prompt":"Un ancien salarié d'un club employant des sportifs rémunérés, dans la discipline concernée, a quitté cet emploi il y a six mois. Selon L.222-9 au 20 octobre 2026, peut-il obtenir immédiatement la carte, toutes les autres conditions étant supposées remplies ?","options":["Oui, car seuls les dirigeants sont visés","Oui, car six mois suffisent","Non, les fonctions de salarié et la période des douze mois précédents sont visées","Oui, dès que le club donne son accord écrit"],"correct":[2],"explanation":"L.222-9 I vise notamment le salarié ou préposé des structures concernées et les fonctions exercées au cours des douze mois précédents. L'accord du club ne supprime pas cette incompatibilité légale.","trap":"Le champ ne se limite plus à une lecture résumée « direction ou entraînement ».","source_ids":["agents"],"origin":"Création pédagogique — L.222-9, version au 20/10/2026"},{"id":"AG03","type":"mcq","topic":"Droit du sport","prompt":"Pour le contrat écrit par lequel l'agent intervient, L.222-17 au 20 octobre 2026 prévoit quelles règles ? Plusieurs réponses exactes : coche-les toutes.","options":["Un contrat écrit préalable avec l'une des parties","Une durée maximale de trois ans, pouvant être abaissée par la fédération","Une rémunération de 10 % obligatoire et intangible","La précision du caractère exclusif ou non des services"],"correct":[0,1,3],"explanation":"Le contrat doit être écrit et préalable. Il précise la nature et l'exclusivité des services ; sa durée ne peut dépasser trois ans et la fédération peut fixer moins. Les 10 % constituent un plafond légal, pas un tarif obligatoire.","trap":"Plafond ≠ taux contractuel imposé. Ne pas oublier les mentions autres que le seul prix.","source_ids":["agents"],"origin":"Création pédagogique — L.222-17 I, version au 20/10/2026"},{"id":"AG04","type":"mcq","topic":"Droit du sport","prompt":"Deux agents coopérant au sein d'une même société veulent représenter chacun un côté d'une même mutation. Selon L.222-17 I au 20 octobre 2026, leur séparation en deux contrats suffit-elle ?","options":["Oui, si chaque agent ne signe qu'un contrat","Oui, si les parties sont informées","Non : la coopération ne permet pas d'agir pour plus d'une partie dans l'ensemble des opérations aboutissant à la mutation","Oui, si les honoraires de chacun sont inférieurs à 10 %"],"correct":[2],"explanation":"L'interdiction vise également plusieurs agents qui coopèrent, notamment au sein d'une même société, dans l'ensemble des contrats aboutissant directement ou indirectement à la mutation. Découper l'opération ne lève pas cette règle.","trap":"Raisonner sur l'opération entière, pas seulement contrat par contrat.","source_ids":["agents"],"origin":"Création pédagogique — L.222-17 I, version au 20/10/2026"},{"id":"AG05","type":"mcq","topic":"Droit du sport","prompt":"Quand L.222-17 I au 20 octobre 2026 exige-t-il de communiquer le contrat de représentation et ses avenants à la fédération ?","options":["Dans le mois suivant leur entrée en vigueur","Uniquement à la clôture annuelle des comptes","Seulement à la demande du joueur","Au choix des parties, si le contrat contient une clause de confidentialité"],"correct":[0],"explanation":"Le 5° du I prévoit l'obligation de communication dans le mois suivant l'entrée en vigueur du contrat ou de l'avenant. Une confidentialité contractuelle ne supprime pas cette obligation légale.","trap":"Distinguer délai de communication et calendrier des autres obligations annuelles.","source_ids":["agents"],"origin":"Création pédagogique — L.222-17 I 5°, version au 20/10/2026"},{"id":"AG06","type":"mcq","topic":"Droit du sport","prompt":"L.222-7 au 20 octobre 2026 prévoit, pour le titulaire de la carte, une formation initiale et continue notamment dans quels domaines ? Plusieurs réponses.","options":["Déontologie","Prévention des violences sexistes et sexuelles","Lutte contre le blanchiment","Aucune formation si le titulaire a déjà étudié la comptabilité"],"correct":[0,1,2],"explanation":"Les trois domaines sont expressément mentionnés. La fédération organise ces formations ; leur contenu, périodicité et modalités de suivi sont définis par décret. Aucun calendrier précis d'application n'est déduit ici du seul article.","trap":"Ne pas transformer un diplôme préalable en dispense non prévue par la source.","source_ids":["agents"],"origin":"Création pédagogique — L.222-7, version au 20/10/2026"},{"id":"AG07","type":"mcq","topic":"Droit du sport","prompt":"Un agent promet une commission à un simple apporteur d'affaires non titulaire de la carte pour lui avoir présenté un joueur. Selon L.222-12-1 au 20 octobre 2026, quelle réponse est correcte ?","options":["La commission est libre si elle est faible","Un écrit suffit à autoriser tout apporteur","La rémunération de ce service de présentation est interdite, sous réserve de l'exception légale visant un apporteur lui-même titulaire de la carte et d'une convention préalable","L'interdiction ne concerne que les entraîneurs"],"correct":[2],"explanation":"Le texte interdit de rémunérer sous quelque forme que ce soit un apporteur pour ce service, sauf s'il détient lui-même la carte et qu'une convention de collaboration a été conclue au préalable. La règle distincte sur les superviseurs administratifs ne permet pas de déguiser une présentation en prospection.","trap":"Bien distinguer superviseur, apporteur d'affaires et agent habilité.","source_ids":["agents"],"origin":"Création pédagogique — L.222-12-1, version au 20/10/2026"},{"id":"AG08","type":"mcq","topic":"Droit du sport","prompt":"Un contrat relatif à l'activité sportive est conclu pour un mineur de 17 ans ; il deviendra majeur pendant son exécution. Selon L.222-5 au 20 octobre 2026, l'intermédiaire peut-il prévoir une commission différée à sa majorité pour cette même opération ?","options":["Oui, si elle est payée après ses 18 ans","Oui, si les parents acceptent","Non : l'interdiction couvre le contrat et ses avenants même si la majorité est atteinte en cours d'exécution","Oui, si le club paie à la place du mineur"],"correct":[2],"explanation":"L.222-5 interdit toute contrepartie, rémunération, indemnité ou avantage pour les intermédiaires concernés pour ce contrat et ses avenants, y compris si le mineur devient majeur pendant son exécution. Différer le paiement ne contourne pas l'interdiction.","trap":"La date du paiement ne suffit pas : regarder la situation et le contrat visés par le texte.","source_ids":["agents"],"origin":"Création pédagogique — L.222-5, version au 20/10/2026"},{"id":"CAS-AG","type":"case","topic":"Droit du sport","prompt":"Cas fictif — droit arrêté au 20 octobre 2026. Un joueur majeur mandate un agent habilité. Le projet de représentation dure quatre ans et prévoit 12 % du montant du contrat sportif. Un second agent de la même société représentera le club. Le contrat de représentation ne serait transmis à la fédération qu'en fin d'année. Identifie les irrégularités, les règles et les corrections à apporter. Ne présume aucune dérogation fédérale plus favorable.","fields":[{"id":"faits","label":"Faits utiles et problèmes juridiques"},{"id":"regles","label":"Règles applicables et articles"},{"id":"application","label":"Application et conclusion"}],"model_answer":[{"label":"Qualification","text":"Un majeur recourt à un agent habilité : le cas porte sur la représentation et ses conditions, non sur une absence de carte. Quatre difficultés distinctes doivent être isolées : durée, rémunération, représentation des deux parties et transmission."},{"label":"Règles","text":"L.222-17 I : contrat écrit préalable ; durée maximale trois ans, pouvant être réduite par la fédération ; rémunération plafonnée à 10 %, avec possibilité fédérale de plafond inférieur ; impossibilité pour des agents coopérant, notamment au sein d'une même société, d'agir pour plus d'une partie dans l'ensemble des opérations de mutation ; communication dans le mois suivant l'entrée en vigueur."},{"label":"Application","text":"Quatre ans dépasse trois ans ; 12 % dépasse 10 % ; deux agents de la même société ne neutralisent pas l'interdiction de représenter les deux côtés en coopérant ; une simple transmission en fin d'année ne garantit pas le délai d'un mois. Refaire un écrit conforme et vérifier le règlement fédéral qui peut être plus strict, pas plus permissif sur ces plafonds."},{"label":"Conclusion","text":"Ne pas exécuter le projet en l'état. L.222-17 prévoit qu'une convention contraire ou non communiquée est réputée nulle et non écrite. La conclusion doit être motivée pour chaque anomalie, sans inventer un accord du club qui les effacerait."}],"rubric":["J'ai isolé les quatre difficultés sans me disperser.","J'ai cité L.222-17 et distingué plafonds légaux et éventuelles limites fédérales inférieures.","J'ai raisonné sur la coopération des agents et l'ensemble de l'opération.","J'ai appliqué les règles aux faits puis conclu sur la non-conformité du projet."],"source_ids":["agents"],"origin":"Cas pratique original, barème qualitatif pédagogique — pas de corrigé officiel"}]},{"id":"transversal","title":"02 · Contrats, associations et assurances","subtitle":"8 QCM + 1 cas pratique · précision des qualifications","minutes":30,"items":[{"id":"TR01","type":"mcq","topic":"Droit des contrats","prompt":"Quelles conditions sont nécessaires à la validité d'un contrat selon l'article 1128 ? Coche toutes les bonnes réponses.","options":["Le consentement des parties","Leur capacité de contracter","Un contenu licite et certain","Un acte notarié dans tous les cas"],"correct":[0,1,2],"explanation":"Les trois conditions de 1128 sont consentement, capacité et contenu licite et certain. Cet article ne rend pas l'acte notarié universellement nécessaire ; des formes spéciales existent pour certains contrats.","trap":"Ne pas confondre validité de droit commun et formalisme propre à un contrat spécial.","source_ids":["validite"],"origin":"Création pédagogique — article 1128"},{"id":"TR02","type":"mcq","topic":"Droit des contrats","prompt":"Quelle affirmation reprend correctement la règle de cumul posée par l'article 1217 du Code civil ?","options":["Toutes les sanctions sont toujours cumulables","Toute résolution interdit des dommages-intérêts","Les sanctions non incompatibles peuvent être cumulées ; des dommages-intérêts peuvent toujours s'y ajouter","Une partie doit toujours choisir entre demander réparation et toute autre sanction"],"correct":[2],"explanation":"1217 autorise le cumul des sanctions compatibles et l'adjonction de dommages-intérêts. Cela ne supprime pas les conditions propres à chaque sanction ni la nécessité d'établir ce qui fonde la réparation demandée.","trap":"« Toujours s'y ajouter » n'est pas « toujours accordés automatiquement ».","source_ids":["inexecution"],"origin":"Création pédagogique — article 1217"},{"id":"TR03","type":"mcq","topic":"Droit des contrats","prompt":"Un mandataire reçoit pouvoir de signer au nom de son mandant. Quelle proposition décrit le mandat selon l'article 1984 ?","options":["Il agit nécessairement en son propre nom, sans représentation","Il reçoit pouvoir de faire quelque chose pour le mandant et en son nom ; le contrat suppose son acceptation","Il peut imposer sans accord toutes ses décisions au mandant","Il doit toujours être un agent sportif"],"correct":[1],"explanation":"L'article 1984 définit le pouvoir de faire quelque chose pour le mandant et en son nom, avec acceptation du mandataire. Un régime professionnel spécial peut imposer d'autres conditions mais ne se déduit pas du seul mandat civil.","trap":"Distinguer représentation au nom d'autrui et opération réalisée en son nom propre.","source_ids":["mandat"],"origin":"Création pédagogique — article 1984"},{"id":"TR04","type":"mcq","topic":"Droit des contrats","prompt":"Le mandataire a dépassé ses pouvoirs. Selon l'article 1998, le mandant est-il tenu de ce qui a été fait au-delà du mandat ?","options":["Toujours, sans condition","Seulement s'il l'a ratifié expressément ou tacitement, selon la règle de cet article","Jamais, même après ratification","Dès que le mandataire a été payé"],"correct":[1],"explanation":"1998 oblige le mandant à exécuter les engagements conformes au pouvoir donné ; au-delà, cet article exige une ratification expresse ou tacite. La question est volontairement limitée à cette règle et n'écarte pas l'analyse d'autres mécanismes dans un cas plus complet.","trap":"Ne pas transformer « dépassement » en nullité absolue automatique ni oublier la ratification.","source_ids":["mandat"],"origin":"Création pédagogique — article 1998"},{"id":"TR05","type":"mcq","topic":"Droit des associations","prompt":"Une association déclarée de droit commun, hors Alsace-Moselle, change de dirigeants. Quel délai de déclaration vise le régime général ?","options":["Quinze jours","Un mois","Trois mois","La prochaine clôture annuelle"],"correct":[2],"explanation":"Les changements d'administration doivent être déclarés dans les trois mois au greffe des associations du département du siège social.","trap":"Ne pas confondre délai de déclaration du changement avec la publicité de la création.","source_ids":["assoc"],"origin":"Question reformulée sur un thème de l'extrait CNOSF 2023 — correction pédagogique"},{"id":"TR06","type":"mcq","topic":"Droit des associations","prompt":"Dans le régime général hors Alsace-Moselle, à partir de quand un changement de dirigeants déclaré devient-il opposable aux tiers ?","options":["À la seule date du vote interne","À la signature du procès-verbal, même sans déclaration","À compter du jour où il est déclaré au greffe des associations","Uniquement après une publication au Journal officiel"],"correct":[2],"explanation":"La fiche institutionnelle distingue adoption interne et opposabilité aux tiers : les changements ne sont opposables qu'à partir de leur déclaration. Ne pas ajouter une publication JO comme condition universelle de ce changement.","trap":"Effet interne et opposabilité externe sont deux questions différentes.","source_ids":["assoc"],"origin":"Question reformulée sur un thème de l'extrait CNOSF 2024 — correction pédagogique"},{"id":"TR07","type":"mcq","topic":"Droit des assurances","prompt":"Selon L.321-1 du Code du sport, que couvre l'obligation d'assurance des associations, sociétés et fédérations sportives ? Plusieurs réponses.","options":["Leur responsabilité civile pour l'activité","La responsabilité civile de leurs préposés salariés ou bénévoles","Celle des pratiquants ; licenciés et pratiquants sont tiers entre eux","Uniquement les dommages matériels de leur propre siège"],"correct":[0,1,2],"explanation":"L.321-1 couvre ces trois catégories et considère licenciés et pratiquants comme tiers entre eux. Les arbitres et juges sont également couverts dans l'exercice de leurs activités. La RC n'est pas une garantie automatique de toute blessure sans responsabilité.","trap":"Une RC collective n'équivaut pas à une individuelle accident universelle.","source_ids":["assurance"],"origin":"Création pédagogique — L.321-1"},{"id":"TR08","type":"mcq","topic":"Droit des assurances","prompt":"Selon L.113-1 du Code des assurances, quelles propositions sont exactes ? Plusieurs réponses.","options":["Une exclusion doit être formelle et limitée, et contenue dans la police","Toute faute de l'assuré exclut nécessairement la garantie","L'assureur ne répond pas des pertes et dommages provenant d'une faute intentionnelle ou dolosive de l'assuré","Une formule vague excluant tout risque suffit toujours"],"correct":[0,2],"explanation":"Le principe couvre les cas fortuits et la faute de l'assuré, sauf exclusion formelle et limitée dans la police ; la faute intentionnelle ou dolosive est hors garantie selon le second alinéa. Toute faute n'est donc pas synonyme d'exclusion.","trap":"Distinguer faute simple, exclusion contractuelle et faute intentionnelle ou dolosive.","source_ids":["exclusion"],"origin":"Création pédagogique — L.113-1"},{"id":"CAS-TR","type":"case","topic":"Contrats et assurances","prompt":"Cas fictif. Une association sportive de droit commun remplace son président mais n'effectue aucune déclaration. Elle affirme ensuite que son assurance RC garantit nécessairement toutes les blessures de ses adhérents, y compris une chute sans tiers responsable. Enfin, elle écarte une demande d'indemnisation au seul motif que l'assuré a été maladroit, sans identifier d'exclusion. Analyse séparément les trois affirmations. Aucune condition contractuelle d'individuelle accident n'est fournie.","fields":[{"id":"qualification","label":"Qualification des trois problèmes"},{"id":"regles","label":"Règles et références"},{"id":"solution","label":"Application, informations manquantes et conclusion"}],"model_answer":[{"label":"Association","text":"Distinguer remplacement interne et opposabilité aux tiers. Le changement doit être déclaré sous trois mois ; l'opposabilité découle de la déclaration. Le procès-verbal seul ne la remplace pas."},{"label":"Assurance sportive","text":"L.321-1 impose une couverture de responsabilité civile, pas une indemnisation automatique de toute blessure de l'adhérent. Il faut rechercher un tiers responsable et la garantie mobilisable ; pour une chute sans responsable, vérifier une assurance de personnes et ses conditions. L.321-4 impose l'information sur l'intérêt d'une telle couverture."},{"label":"Faute et exclusion","text":"Selon L.113-1, une maladresse n'exclut pas à elle seule la garantie. Chercher une exclusion formelle et limitée contenue dans la police, ou une faute intentionnelle/dolosive, sans présumer l'une ni l'autre à partir des seuls faits."},{"label":"Conclusion","text":"Déclarer le changement et examiner les contrats. Impossible de garantir le paiement sans police, circonstances de l'accident et analyse des responsabilités ; impossible aussi de rejeter automatiquement toute demande au seul mot « faute »."}],"rubric":["J'ai séparé les trois problèmes et les régimes applicables.","J'ai distingué effet interne et opposabilité du changement.","J'ai distingué RC et assurance de personnes, sans promettre l'indemnisation.","J'ai identifié les informations manquantes et cité L.113-1 sans confondre maladresse et faute intentionnelle."],"source_ids":["assoc","assurance","exclusion"],"origin":"Cas pratique original — autoévaluation qualitative, pas de corrigé officiel"}]},{"id":"sport-mixte","title":"03 · Dopage et contrôle transversal","subtitle":"8 QCM · sport, sécurité sociale, travail, fiscalité, image et entreprises","minutes":20,"items":[{"id":"MX01","type":"mcq","topic":"Droit du sport","prompt":"Un sportif soutient que l'absence d'intention suffit toujours à exclure toute violation liée à une substance interdite détectée dans son échantillon. Quelle réponse est correcte ?","options":["Vrai : il faut toujours prouver l'intention pour constater la violation","Faux : le principe de responsabilité objective permet un constat même sans intention ; il faut ensuite examiner le régime applicable et les éventuelles justifications","Vrai si un tiers lui a conseillé le produit","Vrai s'il a acheté le produit en pharmacie"],"correct":[1],"explanation":"L'AFLD explique qu'une violation peut être constatée sans intention. Il faut distinguer ce constat de l'examen d'une AUT ou d'autres éléments pertinents et de la détermination de la sanction. L'achat en pharmacie ne vaut pas autorisation antidopage.","trap":"Violation, faute et sanction ne se confondent pas.","source_ids":["afld-responsabilite","afld-glossaire"],"origin":"Création pédagogique — responsabilité objective"},{"id":"MX02","type":"mcq","topic":"Droit du sport","prompt":"Une ordonnance médicale et une autorisation d'usage à des fins thérapeutiques (AUT) sont-elles équivalentes ?","options":["Oui, toute ordonnance autorise les substances interdites","Non : l'AUT est une autorisation sous conditions accordée par une organisation antidopage, distincte de la prescription","Oui, si le médecin est généraliste","Oui, si le sportif n'est pas rémunéré"],"correct":[1],"explanation":"L'AFLD recommande expressément de ne pas confondre ordonnance et AUT. Celle-ci permet sous conditions l'usage d'une substance ou méthode normalement interdite ; son régime doit être vérifié selon la situation du sportif.","trap":"La nécessité médicale n'efface pas à elle seule les démarches antidopage.","source_ids":["afld-responsabilite","afld-glossaire"],"origin":"Création pédagogique — AUT"},{"id":"MX03","type":"mcq","topic":"Droit du sport","prompt":"Selon le glossaire juridique AFLD, quelle proposition est juste à propos d'un résultat d'analyse anormal (RAA) ?","options":["Il équivaut nécessairement à une sanction définitive","Il ne signifie pas nécessairement qu'une violation est établie : une AUT peut notamment expliquer le résultat","Il interdit au sportif de présenter ses explications","Il constitue toujours une condamnation pénale"],"correct":[1],"explanation":"Le RAA est un rapport d'analyse, pas une décision définitive. Le glossaire cite notamment l'hypothèse d'une AUT. Il faut instruire le dossier et distinguer analyse biologique, violation et conséquence disciplinaire.","trap":"Ne pas sauter directement d'un résultat de laboratoire à une sanction certaine.","source_ids":["afld-glossaire"],"origin":"Création pédagogique — glossaire AFLD, RAA"},{"id":"MX04","type":"mcq","topic":"Droit social — sécurité sociale","prompt":"Pour l'assiette des cotisations, quelle affirmation de principe est correcte selon l'Urssaf ?","options":["Les avantages en nature sont toujours hors assiette","Les primes et gratifications ne sont jamais soumises","Salaires, primes et avantages en nature sont en principe soumis ; les frais professionnels peuvent être exonérés sous conditions","Tout versement appelé « remboursement » est exonéré"],"correct":[2],"explanation":"Le nom du versement ne suffit pas : les éléments de rémunération sont en principe soumis. Un remboursement de frais professionnels peut être exclu sous les conditions applicables, qu'il faut documenter.","trap":"Qualification économique et justification avant l'étiquette choisie sur le bulletin.","source_ids":["social"],"origin":"Création pédagogique — assiette sociale, sans barème chiffré"},{"id":"MX05","type":"mcq","topic":"Droit fiscal","prompt":"Une entreprise redevable de TVA dispose d'une facture régulière pour un achat. La facture suffit-elle, à elle seule, à garantir le droit à déduction ?","options":["Oui, toute TVA facturée est récupérable","Non : affectation à une opération ouvrant droit à déduction, exigibilité et exclusions éventuelles doivent aussi être vérifiées","Oui, même en franchise en base","Non, la TVA sur les achats n'est jamais déductible"],"correct":[1],"explanation":"La DGFiP exige un justificatif, l'affectation à l'activité et à une opération ouvrant droit à déduction ainsi que l'exigibilité chez le fournisseur. Des exclusions demeurent possibles ; la franchise en base ne permet pas de récupérer la TVA sur les achats.","trap":"La présence du montant TVA sur une facture n'est pas un droit inconditionnel à déduction.","source_ids":["tva"],"origin":"Création pédagogique — règles consultées en octobre/novembre 2026"},{"id":"MX06","type":"mcq","topic":"Droit de la personnalité","prompt":"Un joueur identifiable a accepté d'être photographié. Un sponsor veut utiliser la photo, son nom et sa voix dans une publicité. Quelle analyse faut-il retenir ?","options":["L'accord pour la photo vaut autorisation universelle de publicité","Une autorisation précise des utilisations doit être vérifiée : durée, territoire et modalités notamment","La notoriété du joueur supprime son droit à l'image publicitaire","Le fait que l'image soit sur un réseau social autorise toute réutilisation"],"correct":[1],"explanation":"La page institutionnelle distingue la prise de vue de l'autorisation d'exploitation. L'accord doit couvrir précisément les usages réels. Le cas publicitaire ne se confond pas avec une utilisation liée à l'information sur l'actualité.","trap":"Photographier, publier une actualité et promouvoir un sponsor sont des usages distincts.","source_ids":["image"],"origin":"Création pédagogique — exploitation publicitaire"},{"id":"MX07","type":"mcq","topic":"Droit des sociétés","prompt":"Une société est en cessation des paiements. Quelle donnée distingue principalement l'ouverture d'une liquidation judiciaire de la logique d'un redressement ?","options":["L'existence de la moindre dette","Le fait que le redressement soit manifestement impossible","L'existence d'au moins un salarié","Le seul désaccord entre associés"],"correct":[1],"explanation":"La liquidation vise la cessation des paiements accompagnée d'un redressement manifestement impossible. Le redressement cherche au contraire à permettre une poursuite ou une réorganisation ; ce n'est pas la simple existence d'une dette qui décide.","trap":"Ne pas confondre pertes comptables, cessation des paiements et impossibilité de redressement.","source_ids":["entreprises"],"origin":"Création pédagogique — entreprises en difficulté"},{"id":"MX08","type":"mcq","topic":"Droit social — travail","prompt":"Un employeur prévoit une amende fixe sur le salaire pour punir un retard, distincte de toute retenue correspondant au temps non travaillé. Selon L.1331-2, cette clause est-elle valable ?","options":["Oui si le salarié a signé","Oui si le règlement intérieur la prévoit","Non : les amendes et sanctions pécuniaires sont interdites, la clause contraire est réputée non écrite","Oui pour les salariés du secteur sportif"],"correct":[2],"explanation":"L.1331-2 interdit les amendes ou autres sanctions pécuniaires. L'accord du salarié ne valide pas une clause contraire. Le cas décrit une punition financière et ne porte pas sur le calcul d'une retenue proportionnelle au temps non travaillé.","trap":"Ne pas assimiler toute variation de salaire à une sanction : qualifier précisément la mesure.","source_ids":["sanction-travail"],"origin":"Création pédagogique — L.1331-2"}]}]}</script><script>/* Noyau pur : aucune dépendance au DOM, au stockage ou à l'horloge. */
(function(root,factory){ if(typeof module==='object'&&module.exports) module.exports=factory(); else root.FFFCore=factory(); })(typeof globalThis!=='undefined'?globalThis:this,function(){
 'use strict';
 const copy=x=>JSON.parse(JSON.stringify(x));
 function item(bank,id){const q=bank.sets.flatMap(s=>s.items).find(q=>q.id===id);if(!q)throw Error('Question inconnue.');return q;}
 function createSession(bank,setId,id,now){const set=bank.sets.find(x=>x.id===setId);if(!set)throw Error('Série inconnue.');return {id,setId,itemIds:set.items.map(q=>q.id),cursor:0,startedAt:now,completedAt:null,answers:{}};}
 function choose(bank,session,id,selected,confidence){const q=item(bank,id);if(q.type!=='mcq'||!session.itemIds.includes(id))throw Error('Question invalide.');if(session.answers[id]?.submittedAt!=null)throw Error('Réponse déjà validée.');if(!Array.isArray(selected)||new Set(selected).size!==selected.length||selected.some(i=>!Number.isInteger(i)||i<0||i>=q.options.length))throw Error('Choix invalide.');if(!['unset','unsure','medium','sure'].includes(confidence))throw Error('Confiance invalide.');const s=copy(session);s.answers[id]={selected:[...selected].sort((a,b)=>a-b),confidence,submittedAt:null};return s;}
 function writeCase(bank,session,id,texts){const q=item(bank,id);if(q.type!=='case'||!session.itemIds.includes(id))throw Error('Cas invalide.');if(session.answers[id]?.submittedAt!=null)throw Error('Réponse déjà validée.');if(Object.keys(texts).some(k=>!q.fields.some(f=>f.id===k))||Object.values(texts).some(t=>typeof t!=='string'||t.length>20000))throw Error('Saisie invalide.');const s=copy(session);s.answers[id]={texts:Object.fromEntries(q.fields.map(f=>[f.id,texts[f.id]||''])),submittedAt:null};return s;}
 function selfAssess(bank,session,id,assessment){if(session.completedAt!==null)throw Error('Séance terminée.');const q=item(bank,id);if(q.type!=='case'||session.answers[id]?.submittedAt==null||!Array.isArray(assessment)||assessment.length!==q.rubric.length||assessment.some(v=>typeof v!=='boolean'))throw Error('Autoévaluation invalide.');const s=copy(session);s.answers[id].assessment=assessment;return s;}
 function submit(bank,session,id,now){if(!session.itemIds.includes(id))throw Error('Question extérieure à cette séance.');if(session.completedAt!==null)throw Error('Séance terminée.');const q=item(bank,id),a=session.answers[id];if(q.type==='mcq'&&!a?.selected?.length)throw Error('Sélectionnez au moins un choix.');if(q.type==='case'&&!Object.values(a?.texts||{}).some(t=>t.trim()))throw Error('Une saisie non vide est requise.');if(a.submittedAt!=null)throw Error('Réponse déjà validée.');const s=copy(session);s.answers[id].submittedAt=now;return s;}
 function feedback(bank,session,id){const q=item(bank,id),a=session.answers[id];if(a?.submittedAt==null)return null;if(q.type==='case')return {model_answer:q.model_answer,rubric:q.rubric,source_ids:q.source_ids};return {correct:JSON.stringify([...q.correct].sort((a,b)=>a-b))===JSON.stringify(a.selected),correctOptions:q.correct,explanation:q.explanation,trap:q.trap,source_ids:q.source_ids};}
 function score(bank,session){const ids=session.itemIds.filter(id=>item(bank,id).type==='mcq'&&session.answers[id]?.submittedAt!=null);return {total:ids.length,correct:ids.filter(id=>feedback(bank,session,id).correct).length};}
 function navigate(session,index){if(!Number.isInteger(index))throw Error('Index invalide.');const s=copy(session);s.cursor=Math.max(0,Math.min(s.itemIds.length-1,index));return s;}
 function elapsed(session,now){return Math.max(0,(session.completedAt??now)-session.startedAt);}
 function finish(bank,session,now){if(session.completedAt!==null)throw Error('Séance déjà terminée.');if(!session.itemIds.every(id=>session.answers[id]?.submittedAt!=null))throw Error('Veuillez valider chaque réponse avant de terminer.');const s=copy(session);s.completedAt=now;return s;}
 function errors(bank,sessions){const latest=new Map();for(const s of [...sessions].sort((a,b)=>a.startedAt-b.startedAt)){for(const id of s.itemIds){if(item(bank,id).type==='mcq'&&s.answers[id]?.submittedAt!=null){const previous=latest.get(id);if(!previous||previous.at<=s.answers[id].submittedAt)latest.set(id,{itemId:id,sessionId:s.id,at:s.answers[id].submittedAt,correct:feedback(bank,s,id).correct});}}}return [...latest.values()].filter(e=>!e.correct);}
 function retry(bank,entries,id,now){const itemIds=[...new Set(entries.map(e=>e.itemId))];if(!itemIds.length)throw Error('Aucune erreur à reprendre.');itemIds.forEach(id=>{if(item(bank,id).type!=='mcq')throw Error('Seuls les QCM sont repris automatiquement.');});return {id,setId:null,itemIds,cursor:0,startedAt:now,completedAt:null,answers:{}};}
 const STORAGE_KEY='agent-fff-progress-v1';
 const TRANSFER_LIMIT_BYTES=2000000;
 const utf8Size=text=>new TextEncoder().encode(text).byteLength;
 function emptyState(bank){return {schema_version:1,bank_updated_on:bank.updated_on,theme:'auto',sessions:[]};}
 function parseState(bank,text){
  if(typeof text!=='string'||utf8Size(text)>TRANSFER_LIMIT_BYTES)throw Error('Import trop volumineux (2 Mo maximum en UTF-8).');
  return decodeState(bank,text);
 }
 // Les sauvegardes internes et exports de secours gardent la validation du schéma,
 // sans appliquer la limite propre aux fichiers importés.
 function decodeState(bank,text){
  try{
   const x=JSON.parse(text,(key,value)=>{if(['__proto__','prototype','constructor'].includes(key))throw Error();return value;});
   const exact=(o,required,optional=[])=>{if(!o||typeof o!=='object'||Array.isArray(o)||required.some(k=>!Object.hasOwn(o,k))||Object.keys(o).some(k=>![...required,...optional].includes(k)))throw Error();};
   const timestamp=v=>Number.isSafeInteger(v)&&v>=0;
   exact(x,['schema_version','bank_updated_on','theme','sessions']);
   if(x.schema_version!==1||x.bank_updated_on!==bank.updated_on||!['auto','light','dark'].includes(x.theme)||!Array.isArray(x.sessions)||x.sessions.length>1000)throw Error();
   const seen=new Set();
   for(const s of x.sessions){
    exact(s,['id','setId','itemIds','cursor','startedAt','completedAt','answers']);
    if(typeof s.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(s.id)||seen.has(s.id))throw Error();seen.add(s.id);
    if(!Array.isArray(s.itemIds)||!s.itemIds.length||new Set(s.itemIds).size!==s.itemIds.length||!Number.isInteger(s.cursor)||s.cursor<0||s.cursor>=s.itemIds.length||!timestamp(s.startedAt)||s.completedAt!==null&&(!timestamp(s.completedAt)||s.completedAt<s.startedAt))throw Error();
    s.itemIds.forEach(id=>item(bank,id));
    if(s.setId!==null){const set=bank.sets.find(v=>v.id===s.setId);if(!set||JSON.stringify(s.itemIds)!==JSON.stringify(set.items.map(q=>q.id)))throw Error();}
    else if(s.itemIds.some(id=>item(bank,id).type!=='mcq'))throw Error();
    exact(s.answers,[],s.itemIds);
    for(const [id,a] of Object.entries(s.answers)){
     const q=item(bank,id);
     if(a.submittedAt!==null&&(!timestamp(a.submittedAt)||a.submittedAt<s.startedAt||s.completedAt!==null&&a.submittedAt>s.completedAt))throw Error();
     if(q.type==='mcq'){
      exact(a,['selected','confidence','submittedAt']);
      if(!Array.isArray(a.selected)||new Set(a.selected).size!==a.selected.length||a.selected.some((v,i)=>!Number.isInteger(v)||v<0||v>=q.options.length||i>0&&v<=a.selected[i-1])||!['unset','unsure','medium','sure'].includes(a.confidence)||a.submittedAt!==null&&!a.selected.length)throw Error();
     }else{
      exact(a,['texts','submittedAt'],['assessment']);exact(a.texts,q.fields.map(f=>f.id));
      if(Object.values(a.texts).some(v=>typeof v!=='string'||v.length>20000)||a.submittedAt!==null&&!Object.values(a.texts).some(v=>v.trim()))throw Error();
      if(a.assessment!==undefined&&(a.submittedAt===null||!Array.isArray(a.assessment)||a.assessment.length!==q.rubric.length||a.assessment.some(v=>typeof v!=='boolean')))throw Error();
     }
    }
    if(s.completedAt!==null&&!s.itemIds.every(id=>s.answers[id]?.submittedAt!=null))throw Error();
   }
   return x;
  }catch{throw Error('Import ou sauvegarde invalide : format, banque ou données incompatibles.');}
 }
 function exportState(bank,state){const text=JSON.stringify(state,null,2);decodeState(bank,text);return text;}
 function load(bank,storage){try{const text=storage.getItem(STORAGE_KEY);if(!text)return {state:emptyState(bank),persistent:true,warning:''};try{const state=decodeState(bank,text);return {state,persistent:true,warning:utf8Size(exportState(bank,state))>TRANSFER_LIMIT_BYTES?'Historique au-delà de 2 Mo : export de récupération possible, non réimportable. Aucune modification au-delà de la limite ne sera acceptée.':''};}catch{return {state:emptyState(bank),persistent:false,warning:'Sauvegarde invalide ou incompatible. Données conservées dans le navigateur ; session temporaire. Exportez avant de fermer.'};}}catch{return {state:emptyState(bank),persistent:false,warning:'Stockage indisponible : mode temporaire. Exportez votre bilan avant de fermer.'};}}
 function save(bank,storage,state){try{storage.setItem(STORAGE_KEY,exportState(bank,state));return {persistent:true,warning:''};}catch{return {persistent:false,warning:'Sauvegarde impossible : mode temporaire. Exportez votre bilan avant de fermer.'};}}
 return {TRANSFER_LIMIT_BYTES,createSession,choose,submit,feedback,score,writeCase,selfAssess,navigate,elapsed,finish,errors,retry,emptyState,parseState,exportState,load,save};
});
</script><script>/* Interface locale : toutes les données sont rendues par textContent. */
(function(){
 'use strict';
 const root=document.getElementById('app');
 function fatal(error){let box=document.getElementById('fatal');if(!box){box=document.createElement('p');box.id='fatal';box.setAttribute('role','alert');document.body.prepend(box);}box.textContent='Erreur : '+(error?.message||String(error))+'. Rechargez la page ou exportez votre bilan si possible.';}
 window.addEventListener('error',e=>fatal(e.error||e.message));
 window.addEventListener('unhandledrejection',e=>fatal(e.reason));
 try{
 const C=window.FFFCore,bank=JSON.parse(document.getElementById('bank').textContent);

 const loaded=C.load(bank,storage);let state=loaded.state,warning=loaded.warning,storageLocked=!loaded.persistent,view='today',activeId=null,refsOpen=false;
 let main,alertBox,statusBox;
 const all=bank.sets.flatMap(s=>s.items),question=id=>all.find(q=>q.id===id);
 const session=()=>state.sessions.find(s=>s.id===activeId);
 function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
 function safe(action){try{action();}catch(error){render();alertBox.textContent=error.message||String(error);}}
 function button(text,fn,cls){const b=el('button',text,cls);b.type='button';b.addEventListener('click',()=>safe(fn));return b;}
 function persist(){if(!storageLocked){const result=C.save(bank,storage,state);warning=result.warning;if(!result.persistent)storageLocked=true;}statusBox.textContent=warning||'Sauvegardé sur ce navigateur uniquement · Aucune synchronisation';statusBox.className=warning?'storage warning':'storage';}
 function replace(candidate){const json=C.exportState(bank,candidate);if(new Blob([json]).size>C.TRANSFER_LIMIT_BYTES)throw Error('Modification refusée : le bilan dépasserait 2 Mo en UTF-8. Votre état précédent est conservé. Exportez votre bilan actuel ; vous pouvez réduire une saisie avant de réessayer.');state=candidate;persist();}
 function update(s){replace({...state,sessions:state.sessions.map(x=>x.id===s.id?s:x)});}
 function id(){return 's_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);}
 function title(s){return bank.sets.find(x=>x.id===s.setId)?.title||'Reprise des erreurs';}
 function duration(s){const seconds=Math.floor(C.elapsed(s,Date.now())/1000);return Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');}
 function card(heading,body){const c=el('section',undefined,'card');if(heading)c.append(el('h2',heading));if(body)c.append(el('p',body,'muted'));return c;}
 function go(tab){view=tab;activeId=null;refsOpen=false;render();window.scrollTo(0,0);}
 function open(s){activeId=s.id;view='session';refsOpen=false;render();window.scrollTo(0,0);}
 function start(setId){const draft=state.sessions.find(s=>s.setId===setId&&s.completedAt===null);if(draft)return open(draft);const s=C.createSession(bank,setId,id(),Date.now());replace({...state,sessions:[...state.sessions,s]});open(s);}
 function shell(){
  if(state.theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=state.theme;
  root.replaceChildren();const head=el('header',undefined,'topbar');const brand=el('div');brand.append(el('div','A / F','monogram'),el('span',bank.title,'brand'));head.append(brand,el('span','ATELIER D’ENTRAÎNEMENT','eyebrow'));root.append(head);
  statusBox=el('p',warning||'Sauvegarde locale · Aucune synchronisation',warning?'storage warning':'storage');root.append(statusBox);
  alertBox=el('p',undefined,'alert');alertBox.setAttribute('role','alert');root.append(alertBox);
  main=el('main');main.id='main';root.append(main);
  const nav=el('nav',undefined,'bottom-nav');nav.setAttribute('aria-label','Navigation principale');
  for(const [key,label,mark]of [['today','Aujourd’hui','◷'],['sets','Séries','▤'],['errors','Erreurs','↻'],['progress','Suivi','▥']]){const b=button('',()=>go(key));b.append(el('span',mark,'nav-icon'),el('span',label));if(view===key||(view==='session'&&key==='sets'))b.setAttribute('aria-current','page');nav.append(b);}root.append(nav);
 }
 function heading(kicker,titleText,description){main.append(el('p',kicker,'eyebrow'),el('h1',titleText));if(description)main.append(el('p',description,'lead'));}
 function today(){
  heading('LA RÉGULARITÉ AVANT LA VITESSE','Aujourd’hui','Un exercice, une décision, une justification.');
  const hero=card('Votre prochaine séance','Épreuve visée : '+bank.exam_date+' · Banque mise à jour le '+bank.updated_on+'.');hero.classList.add('hero');
  const draft=state.sessions.find(s=>s.completedAt===null);const next=bank.sets.find(set=>!state.sessions.some(s=>s.setId===set.id&&s.completedAt!==null))||bank.sets[0];
  hero.append(button(draft?'Reprendre · '+title(draft):'Commencer · '+next.title,()=>draft?open(draft):start(next.id),'primary'));main.append(hero);
  const notice=card('Cadre pédagogique','Exercices originaux, pas un sujet officiel. Corrections après validation ; sauvegarde locale.');const details=el('details');details.append(el('summary','Lire les règles et limites'),el('p',bank.notice,'muted'));notice.append(details);main.append(notice);
  for(const p of bank.priorities)main.append(card(p.title,p.body));
 }
 function sets(){heading('ENTRAÎNEMENTS','Les séries','Chaque série conserve son propre brouillon.');for(const set of bank.sets){const draft=state.sessions.find(s=>s.setId===set.id&&s.completedAt===null);const c=card(set.title,set.subtitle);c.append(el('p',set.items.length+' exercices · '+set.minutes+' min conseillées','meta'),button((draft?'Reprendre · ':'Commencer · ')+set.title,()=>draft?open(draft):start(set.id),'primary'));main.append(c);}}
 function referenceList(ids,parent){for(const source of bank.sources.filter(s=>ids.includes(s.id))){const c=el('div',undefined,'source');const a=el('a',source.label);a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';c.append(a,el('p',source.article),el('p','Version : '+source.version+' · Vérifié le '+source.checked_on,'meta'));parent.append(c);}}
 function exercise(){
  const s=session();if(!s)throw Error('Séance introuvable');const q=question(s.itemIds[s.cursor]),a=s.answers[q.id],feedback=C.feedback(bank,s,q.id),locked=a?.submittedAt!=null;
  main.append(button('← Toutes les séries',()=>go('sets'),'quiet'));
  const line=el('div',undefined,'session-line');line.append(el('span',title(s),'meta'));const time=el('span',duration(s),'timer');time.id='timer';line.append(time);main.append(line);
  main.append(el('p','Exercice '+(s.cursor+1)+' / '+s.itemIds.length+' · '+q.topic,'eyebrow'));
  const bar=el('progress');bar.max=s.itemIds.length;bar.value=s.itemIds.filter(id=>s.answers[id]?.submittedAt!=null).length;bar.setAttribute('aria-label','Réponses validées');main.append(bar,el('p',bar.value+' réponses validées sur '+s.itemIds.length,'meta'));
  const c=card();c.append(el('p',q.type==='mcq'?'QCM · Respectez le nombre de réponses demandé':'Cas pratique · Réponse guidée','meta'),el('h1',q.type==='case'?'À vous de rédiger':q.prompt,q.type==='case'?'case-heading':'prompt'));if(q.type==='case')c.append(el('p',q.prompt,'case-prompt'));c.append(el('p',locked?q.origin:'Création pédagogique · Corrigé et références après validation','origin'));
  if(q.type==='mcq'){
   const field=el('fieldset');field.append(el('legend','Votre réponse'));
   q.options.forEach((text,index)=>{const label=el('label',undefined,'option');const input=el('input');input.type='checkbox';input.checked=!!a?.selected.includes(index);input.disabled=locked;input.addEventListener('change',()=>safe(()=>{const current=session().answers[q.id];const selected=new Set(current?.selected||[]);input.checked?selected.add(index):selected.delete(index);update(C.choose(bank,session(),q.id,[...selected],current?.confidence||'unset'));}));label.append(input,el('span',text));field.append(label);});c.append(field);
   const label=el('label','Votre confiance','field-label');const select=el('select');select.setAttribute('aria-label','Votre confiance');for(const [value,text]of [['unset','Non renseignée'],['unsure','À vérifier'],['medium','Plutôt confiant'],['sure','Certain']]){const o=el('option',text);o.value=value;select.append(o);}select.value=a?.confidence||'unset';select.disabled=locked;select.addEventListener('change',()=>safe(()=>update(C.choose(bank,session(),q.id,session().answers[q.id]?.selected||[],select.value))));label.append(select);c.append(label);
  }else{
   for(const field of q.fields){const label=el('label',field.label,'field-label');const text=el('textarea');text.setAttribute('aria-label',field.label);text.maxLength=20000;text.value=a?.texts[field.id]||'';text.disabled=locked;text.addEventListener('input',()=>safe(()=>{const texts={...session().answers[q.id]?.texts};for(const f of q.fields)if(!Object.hasOwn(texts,f.id))texts[f.id]='';texts[field.id]=text.value;update(C.writeCase(bank,session(),q.id,texts));}));label.append(text);c.append(label);}
  }
  if(!locked)c.append(button('Valider ma réponse',()=>{update(C.submit(bank,session(),q.id,Date.now()));refsOpen=false;render();},'primary full'));
  if(feedback&&q.type==='mcq'){
   const result=el('section',undefined,feedback.correct?'feedback success':'feedback incorrect');result.setAttribute('aria-label','Correction');result.append(el('h2',feedback.correct?'Réponse exacte':'À retravailler'),el('p','Réponses attendues : '+feedback.correctOptions.map(i=>q.options[i]).join(' ; ')),el('p',feedback.explanation),el('h3','Le piège'),el('p',feedback.trap));c.append(result);
  }
  if(feedback&&q.type==='case'){
   const model=el('section',undefined,'feedback');model.append(el('h2','Proposition de correction'));for(const part of feedback.model_answer)model.append(el('h3',part.label),el('p',part.text));model.append(el('h3','Grille d’autoévaluation'),el('p','Autoévaluation non notée automatiquement. Cochez les points effectivement traités.','meta'));
   feedback.rubric.forEach((text,index)=>{const label=el('label',undefined,'option');const input=el('input');input.type='checkbox';input.checked=!!a.assessment?.[index];input.disabled=s.completedAt!==null;input.addEventListener('change',()=>safe(()=>{const assessment=[...(session().answers[q.id].assessment||q.rubric.map(()=>false))];assessment[index]=input.checked;update(C.selfAssess(bank,session(),q.id,assessment));}));label.append(input,el('span',text));model.append(label);});c.append(model);
  }
  if(feedback){c.append(button('Références datées',()=>{refsOpen=!refsOpen;render();},'secondary'));if(refsOpen){const refs=el('section',undefined,'references');referenceList(q.source_ids,refs);c.append(refs);}}
  main.append(c);
  const actions=el('div',undefined,'actions');const previous=button('← Précédent',()=>{update(C.navigate(session(),s.cursor-1));refsOpen=false;render();window.scrollTo(0,0);},'secondary');previous.disabled=s.cursor===0;const next=button('Suivant →',()=>{update(C.navigate(session(),s.cursor+1));refsOpen=false;render();window.scrollTo(0,0);},'secondary');next.disabled=s.cursor===s.itemIds.length-1;actions.append(previous,next);main.append(actions);
  if(s.completedAt===null)main.append(button('Terminer la séance',()=>{update(C.finish(bank,session(),Date.now()));view='summary';render();window.scrollTo(0,0);},'primary full'));
 }
 function summary(){const s=session(),n=C.score(bank,s);heading('BILAN PÉDAGOGIQUE','Séance terminée',title(s));const c=card(n.correct+' / '+n.total+' QCM exacts','Barème pédagogique : 1 point uniquement pour la combinaison exacte. Cas pratiques exclus du score automatique.');c.append(el('p','Durée : '+duration(s)),button('Voir mon suivi',()=>go('progress'),'primary'));main.append(c);}
 function errors(){const entries=C.errors(bank,state.sessions);heading('RÉVISION CIBLÉE','Les erreurs','Un nouvel essai ne modifie jamais vos réponses précédentes.');if(!entries.length){main.append(card('Aucune erreur en attente','Les QCM incorrects apparaîtront ici après validation.'));return;}const c=card(entries.length+' QCM à reprendre','La dernière réponse validée détermine les erreurs en attente, même dans une séance non terminée.');c.append(button('Refaire les erreurs',()=>{const s=C.retry(bank,entries,id(),Date.now());replace({...state,sessions:[...state.sessions,s]});open(s);},'primary'));main.append(c);for(const entry of entries)main.append(card(question(entry.itemId).topic,question(entry.itemId).prompt));}
 function progress(){
  const completed=state.sessions.filter(s=>s.completedAt!==null),scores=completed.map(s=>C.score(bank,s)),total=scores.reduce((n,x)=>n+x.total,0),correct=scores.reduce((n,x)=>n+x.correct,0);
  heading('VOS REPÈRES','Suivi',completed.length+' séance'+(completed.length===1?' terminée':'s terminées')+' · Historique conservé sur ce navigateur.');
  const stats=el('div',undefined,'stats');stats.append(card(correct+' / '+total,'QCM exacts · tous les essais'),card(String(C.errors(bank,state.sessions).length),'Erreurs en attente'));main.append(stats);
  const chart=card('Vos résultats','Les cas pratiques ne sont jamais notés automatiquement. Aucun seuil officiel ni maîtrise déduite.');for(const s of completed){const n=C.score(bank,s);const b=button(title(s)+' · '+n.correct+'/'+n.total,()=>open(s),'secondary full');const bar=el('div',undefined,'chart'),fill=el('span');fill.style.width=(n.total?100*n.correct/n.total:0)+'%';bar.append(fill);chart.append(b,bar);}main.append(chart);
  for(const s of [...completed].reverse()){const n=C.score(bank,s);const c=card(title(s),new Date(s.completedAt).toLocaleString('fr-FR')+' · '+duration(s)+' · '+n.correct+'/'+n.total+' QCM');c.append(button('Consulter · '+title(s),()=>open(s),'secondary'));main.append(c);}
  const drafts=state.sessions.filter(s=>s.completedAt===null);if(drafts.length){const c=card('Brouillons en cours');for(const s of drafts)c.append(button('Reprendre · '+title(s),()=>open(s),'secondary full'));main.append(c);}
  const settings=card('Affichage');const theme=el('select');theme.setAttribute('aria-label','Thème');for(const [value,text]of [['auto','Selon l’appareil'],['light','Clair'],['dark','Sombre']]){const option=el('option',text);option.value=value;theme.append(option);}theme.value=state.theme;theme.addEventListener('change',()=>safe(()=>{replace({...state,theme:theme.value});render();}));settings.append(theme);main.append(settings);
  const transfer=card('Votre bilan vous appartient','Aucune synchronisation. Exportez avant de changer de navigateur ou d’appareil. L’import remplace l’état local après confirmation ; les bilans ne sont pas fusionnés.');
  transfer.append(button('Exporter mon bilan',()=>{
   const json=C.exportState(bank,state),blob=new Blob([json],{type:'application/json'}),recovery=blob.size>C.TRANSFER_LIMIT_BYTES;
   const label=el('label',recovery?'Export de récupération non réimportable : le bilan dépasse 2 Mo. Conservez ce JSON intégral ; aucune donnée supprimée.':'Si le téléchargement est bloqué, copiez ce JSON.','field-label'),text=el('textarea');
   text.readOnly=true;text.setAttribute('aria-label','Bilan JSON à copier');text.value=json;label.append(text);transfer.append(label);
   const url=URL.createObjectURL(blob),a=el('a',recovery?'Télécharger la récupération JSON — non réimportable':'Télécharger le bilan JSON');a.href=url;a.download=recovery?'agent-fff-recuperation.json':'agent-fff-bilan.json';a.className='download';transfer.append(a);a.click();window.setTimeout(()=>URL.revokeObjectURL(url),60000);
  },'primary'));
  const label=el('label','Importer un bilan JSON (2 Mo maximum)','file-label'),input=el('input');input.type='file';input.accept='.json,application/json';input.setAttribute('aria-label','Importer un bilan JSON');label.append(input);transfer.append(label);const preview=el('div');preview.setAttribute('aria-live','polite');transfer.append(preview);
  input.addEventListener('change',async()=>{try{preview.replaceChildren();const file=input.files?.[0];if(!file)return;if(file.size>C.TRANSFER_LIMIT_BYTES)throw Error('Import trop volumineux (2 Mo maximum en UTF-8).');const imported=C.parseState(bank,await file.text());preview.append(el('p',imported.sessions.length+' séances à importer. Exportez votre bilan actuel avant de confirmer.'),button('Confirmer l’import',()=>{replace(imported);render();alertBox.textContent='Import effectué. '+(warning||'État local remplacé.');},'secondary'));}catch(error){alertBox.textContent=error.message||String(error);}});
  main.append(transfer);
  const unlocked=[...new Set(state.sessions.flatMap(s=>s.itemIds.filter(id=>s.answers[id]?.submittedAt!=null).flatMap(id=>question(id).source_ids)))];
  const library=card('Bibliothèque des sources',unlocked.length?'Seules les références des exercices déjà validés sont accessibles ici.':'Les références deviennent accessibles après validation d’une réponse.');if(unlocked.length)library.append(button('Ouvrir la bibliothèque',()=>{if(library.querySelector('.references'))return;const refs=el('section',undefined,'references');referenceList(unlocked,refs);library.append(refs);},'secondary'));main.append(library);
 }
 function render(){shell();if(view==='today')today();else if(view==='sets')sets();else if(view==='session')exercise();else if(view==='summary')summary();else if(view==='errors')errors();else progress();}
 render();
 window.setInterval(()=>{try{const node=document.getElementById('timer');if(node&&session())node.textContent=duration(session());}catch(error){fatal(error);}},1000);
 }catch(error){fatal(error);}
})();
</script></body></html>
